# English edition: modified 2026-10-20; see EDITION-NOTICE.md at package root.
name: nature-paper-trans
description: Translate selected pages or full research-paper PDFs into image-based PDFs in the requested language while preserving each source page's size, orientation, layout, columns, figures, and equations as closely as possible. Deliver only the translated PDF for reading, not an editable Word reconstruction or word-by-word proofread edition.
always_load:
  - SKILL.md
references:
  on_demand:
    - condition: before the first page-generation request
      path: references/image-translation-prompt.md
scripts:
  on_demand:
    - condition: preparing source pages, tracking results, or assembling deliverables
      path: scripts/pages.py
